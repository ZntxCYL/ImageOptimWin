name: Windows bundled build
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-2025
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Compile application and updater before downloading engines
        shell: pwsh
        run: dotnet build ./ImageOptim.Win.sln -c Release --nologo
      - name: Bundle, build and publish offline-ready Windows package
        shell: pwsh
        run: ./publish.ps1 -Runtime win-x64
      - name: Validate embedded Windows EXE icon transparency
        shell: pwsh
        run: ./scripts/check-windows-app-icon.ps1 -AppDirectory dist/win-x64
      - name: Smoke-test included Windows engines and SVGO
        shell: pwsh
        run: ./scripts/smoke-test.ps1 -AppDirectory dist/win-x64
      - name: Upload bundled ZIP
        uses: actions/upload-artifact@v6
        with:
          name: ImageOptimWin-win-x64-Bundled
          path: dist/ImageOptimWin-win-x64-Bundled.zip
          if-no-files-found: error
